# docker-compose.yml
# used for local postgresql and mailpit services

services:
  postgres:
    image: postgres:16-alpine
    container_name: concert-district-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: concert_district
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concert -d concert_district"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: concert-district-mail
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: